
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>KOLLINSKY BATTLE ROYALE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- START SCREEN -->
    <div id="startScreen">

        <div class="startContent">

            <h1>KOLLINSKY</h1>

            <h2>BATTLE ROYALE</h2>

            <p>ENTER THE BATTLEFIELD</p>

            <button id="startButton">
                START GAME
            </button>

        </div>

    </div>


    <!-- ROTATE PHONE SCREEN -->
    <div id="rotateScreen">

        <div class="rotateContent">

            <div class="phoneIcon">📱</div>

            <h2>ROTATE YOUR DEVICE</h2>

            <p>
                Please rotate your phone horizontally
                to play the game.
            </p>

        </div>

    </div>


    <!-- GAME CONTAINER -->
    <div id="gameContainer">

        <!-- THREE.JS GAME -->
        <canvas id="game"></canvas>


        <!-- GAME HUD -->
        <div id="hud">

            <!-- TOP HUD -->
            <div class="topHud">

                <div class="playerInfo">

                    <span id="playerName">
                        KOLLINSKY
                    </span>

                    <span id="health">
                        HP: 100
                    </span>

                </div>


                <div class="battleInfo">

                    <span id="kills">
                        KILLS: 0
                    </span>

                    <span id="alive">
                        ALIVE: 20
                    </span>

                </div>

            </div>


            <!-- ZONE -->
            <div id="zone">

                SAFE ZONE

            </div>


            <!-- CROSSHAIR -->
            <div id="crosshair">

                <div class="crosshairHorizontal"></div>

                <div class="crosshairVertical"></div>

            </div>


            <!-- AMMO -->
            <div id="ammo">

                <span id="weaponName">
                    ASSAULT RIFLE
                </span>

                <span id="ammoCount">
                    30 / 120
                </span>

            </div>


            <!-- MESSAGE -->
            <div id="message">

                READY

            </div>


            <!-- MOBILE CONTROLS -->
            <div id="mobileControls">

                <!-- MOVEMENT -->
                <div id="joystickArea">

                    <div id="joystick">

                        <div id="joystickKnob"></div>

                    </div>

                </div>


                <!-- SHOOT BUTTON -->
                <button id="shootButton">

                    SHOOT

                </button>


                <!-- AIM BUTTON -->
                <button id="aimButton">

                    AIM

                </button>


                <!-- JUMP BUTTON -->
                <button id="jumpButton">

                    JUMP

                </button>


                <!-- RELOAD BUTTON -->
                <button id="reloadButton">

                    RELOAD

                </button>


                <!-- RUN BUTTON -->
                <button id="runButton">

                    RUN

                </button>

            </div>

        </div>

    </div>


    <!-- THREE.JS ENGINE -->
    <script src="three.min.js"></script>


    <!-- GAME JAVASCRIPT -->
    <script src="game.js"></script>

</body>
</html>
