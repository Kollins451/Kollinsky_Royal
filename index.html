<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no,
        viewport-fit=cover"
    >

    <meta name="theme-color" content="#050914">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="description"
        content="Kollinsky Battle Royale"
    >

    <title>Kollinsky Battle Royale</title>


    <!-- YOUR CSS -->
    <link rel="stylesheet" href="style.css">


    <!-- =====================================================
         BASIC GAME STYLES
    ====================================================== -->

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #050914;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            touch-action: none;
        }

        body {
            position: relative;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
        }


        /* =================================================
           START MENU
        ================================================= */

        #menu {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 25px;

            color: white;

            background:
                radial-gradient(
                    circle at center,
                    #124f96 0%,
                    #071c3b 45%,
                    #02050c 100%
                );

            z-index: 10000;
        }


        #menu .logo {

            font-size: 18px;

            font-weight: 900;

            letter-spacing: 9px;

            margin-bottom: 15px;
        }


        #menu h1 {

            margin: 0;

            font-size:
                clamp(
                    40px,
                    9vw,
                    100px
                );

            line-height: 1;

            font-weight: 900;

            letter-spacing: 3px;

            text-shadow:
                0 5px 20px
                rgba(0,0,0,0.5);
        }


        #menu p {

            margin-top: 22px;

            margin-bottom: 35px;

            max-width: 600px;

            color:
                rgba(255,255,255,0.8);

            font-size:
                clamp(
                    14px,
                    2vw,
                    20px
                );
        }


        /* =================================================
           START BUTTON
        ================================================= */

        #startBtn {

            min-width: 220px;

            padding:
                18px 35px;

            border-radius: 12px;

            background: white;

            color: #071225;

            font-size: 18px;

            font-weight: 900;

            letter-spacing: 1px;

            box-shadow:
                0 10px 35px
                rgba(0,0,0,0.4);

            transition:
                transform .15s ease,
                box-shadow .15s ease;
        }


        #startBtn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.5);
        }


        #startBtn:active {

            transform:
                scale(.96);
        }


        /* =================================================
           ROTATE SCREEN
        ================================================= */

        #rotateScreen {

            position: fixed;

            inset: 0;

            display: none;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            text-align: center;

            padding: 30px;

            background: #030711;

            color: white;

            z-index: 20000;
        }


        #rotateScreen .phoneIcon {

            font-size: 70px;

            margin-bottom: 20px;

            animation:
                rotatePhone
                1.5s
                infinite
                ease-in-out;
        }


        #rotateScreen h2 {

            margin: 0 0 10px;

            font-size: 28px;
        }


        #rotateScreen p {

            max-width: 400px;

            line-height: 1.5;

            color:
                rgba(255,255,255,0.7);
        }


        @keyframes rotatePhone {

            0% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(90deg);
            }

            100% {
                transform: rotate(90deg);
            }

        }


        /* =================================================
           GAME HUD
        ================================================= */

        #gameHUD {

            position: fixed;

            inset: 0;

            display: none;

            pointer-events: none;

            z-index: 5000;

            color: white;
        }


        /* =================================================
           HEALTH
        ================================================= */

        #healthBox {

            position: absolute;

            left: 20px;

            top: 20px;

            width: 220px;

            padding: 10px;

            background:
                rgba(0,0,0,.35);

            border-radius: 10px;
        }


        #healthText {

            font-size: 14px;

            font-weight: 800;

            margin-bottom: 7px;
        }


        #healthBar {

            width: 100%;

            height: 10px;

            background:
                rgba(255,255,255,.2);

            border-radius: 10px;

            overflow: hidden;
        }


        #healthFill {

            width: 100%;

            height: 100%;

            background: #25e36f;

            transition:
                width .2s ease;
        }


        /* =================================================
           AMMO
        ================================================= */

        #ammoBox {

            position: absolute;

            right: 25px;

            bottom: 25px;

            font-size: 28px;

            font-weight: 900;

            text-shadow:
                0 3px 10px
                rgba(0,0,0,.8);
        }


        /* =================================================
           CROSSHAIR
        ================================================= */

        #crosshair {

            position: absolute;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            width: 28px;

            height: 28px;
        }


        #crosshair::before,
        #crosshair::after {

            content: "";

            position: absolute;

            background: white;

            box-shadow:
                0 0 4px black;
        }


        #crosshair::before {

            width: 2px;

            height: 28px;

            left: 13px;

            top: 0;
        }


        #crosshair::after {

            width: 28px;

            height: 2px;

            left: 0;

            top: 13px;
        }


        /* =================================================
           MOBILE CONTROLS
        ================================================= */

        #mobileControls {

            position: fixed;

            inset: 0;

            display: none;

            pointer-events: none;

            z-index: 6000;
        }


        #joystickArea {

            position: absolute;

            left: 30px;

            bottom: 30px;

            width: 150px;

            height: 150px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.08);

            border:
                2px solid
                rgba(255,255,255,.2);

            pointer-events: auto;
        }


        #joystick {

            position: absolute;

            width: 65px;

            height: 65px;

            left: 42px;

            top: 42px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.35);

            border:
                2px solid
                rgba(255,255,255,.6);
        }


        #fireButton {

            position: absolute;

            right: 35px;

            bottom: 40px;

            width: 90px;

            height: 90px;

            border-radius: 50%;

            background:
                rgba(220,40,40,.75);

            color: white;

            font-size: 17px;

            font-weight: 900;

            pointer-events: auto;

            border:
                3px solid
                rgba(255,255,255,.5);
        }


        #jumpButton {

            position: absolute;

            right: 145px;

            bottom: 50px;

            width: 65px;

            height: 65px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.2);

            color: white;

            font-weight: 900;

            pointer-events: auto;
        }


        #reloadButton {

            position: absolute;

            right: 160px;

            bottom: 130px;

            width: 60px;

            height: 60px;

            border-radius: 50%;

            background:
                rgba(255,255,255,.2);

            color: white;

            font-size: 10px;

            font-weight: 900;

            pointer-events: auto;
        }


        /* =================================================
           CANVAS
        ================================================= */

        canvas {

            display: block;

            width: 100%;

            height: 100%;

            touch-action: none;
        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 899px) {

            #mobileControls {

                display: block;
            }

            #healthBox {

                left: 12px;

                top: 12px;

                width: 170px;
            }

            #ammoBox {

                right: 15px;

                bottom: 15px;

                font-size: 22px;
            }
        }


        /* =================================================
           DESKTOP
        ================================================= */

        @media (min-width: 900px) {

            #mobileControls {

                display: none !important;
            }
        }


        /* =================================================
           PHONE PORTRAIT MODE
        ================================================= */

        @media
        (orientation: portrait)
        and (max-width: 899px) {

            #rotateScreen {

                display: flex;
            }

            #gameHUD {

                display: none !important;
            }

            #mobileControls {

                display: none !important;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         MAIN MENU
    ====================================================== -->

    <div id="menu">

        <div class="logo">
            KOLLINSKY
        </div>

        <h1>
            BATTLE ROYALE
        </h1>

        <p>
            Survive. Fight. Become the last player standing.
        </p>

        <button
            id="startBtn"
            type="button"
        >
            START GAME
        </button>

    </div>


    <!-- =====================================================
         ROTATE PHONE MESSAGE
    ====================================================== -->

    <div id="rotateScreen">

        <div class="phoneIcon">
            📱
        </div>

        <h2>
            Rotate Your Phone
        </h2>

        <p>
            Turn your phone sideways
            to play Kollinsky Battle Royale.
        </p>

    </div>


    <!-- =====================================================
         GAME HUD
    ====================================================== -->

    <div id="gameHUD">

        <div id="healthBox">

            <div id="healthText">
                HP 100 / 100
            </div>

            <div id="healthBar">

                <div id="healthFill"></div>

            </div>

        </div>


        <div id="crosshair"></div>


        <div id="ammoBox">

            🔫

            <span id="ammo">
                30
            </span>

        </div>

    </div>


    <!-- =====================================================
         MOBILE CONTROLS
    ====================================================== -->

    <div id="mobileControls">


        <div id="joystickArea">

            <div id="joystick"></div>

        </div>


        <button
            id="fireButton"
            type="button"
        >
            FIRE
        </button>


        <button
            id="jumpButton"
            type="button"
        >
            JUMP
        </button>


        <button
            id="reloadButton"
            type="button"
        >
            RELOAD
        </button>

    </div>


    <!-- =====================================================
         THREE.JS
         
         IMPORTANT:
         This is now your LOCAL Three.js file.
         
         It must be in the SAME folder as index.html.
    ====================================================== -->

    <script src="three.min.js"></script>


    <!-- =====================================================
         YOUR GAME
         
         Leave game.js as it is.
    ====================================================== -->

    <script src="game.js"></script>


</body>

</html>
